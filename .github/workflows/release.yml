name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: softprops/action-gh-release@v2
        with:
          files: bin/Island.exe
          generate_release_notes: true
